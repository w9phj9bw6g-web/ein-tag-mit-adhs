<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ein Tag mit ADHS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, ehrlich, ein bisschen verspielt – nie belehrend.
   IDEA: die Seite ist ein einziger Tag; der Himmel oben wandert von Morgengrauen bis Nacht.
   PICTURE: Himmelsband mit Sonne/Mond über einer großen Akku-Leiste, darunter die Situationskarte.
   COLOUR and TYPE: Himmelsfarben wechseln mit der Uhrzeit, Korall als Akzent, Akku Grün→Gelb→Rot; Nunito.
   LAYOUT: eine ruhige Spalte, 680px, Himmel und Leisten oben, immer nur eine Frage. */
:root{color-scheme:light dark;--bg:light-dark(#f6f4ef,#11131a);--ink:light-dark(#1b1d2a,#eef0f6);--soft:light-dark(#5b5f70,#a9aec0);--card:light-dark(#ffffff,#1b1e29);--line:light-dark(#e4e1d8,#2c3040);--acc:#ff5a3c;--accink:#fff;--boost:#f2b705}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 48px}
.sky{position:relative;height:170px;border-radius:0 0 28px 28px;overflow:hidden;transition:background 1.2s;margin:0 -16px}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.sky .hd{position:absolute;left:20px;right:20px;top:16px;display:flex;justify-content:space-between;align-items:baseline;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.sky h1{font-size:20px;margin:0;font-weight:900}
.clock{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
.meters{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-top:-34px;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.erow{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.erow b{font-size:28px;font-variant-numeric:tabular-nums}
.bat{position:relative;height:30px;border-radius:10px;border:3px solid var(--ink);margin:6px 8px 12px 0;padding:3px}
.bat::after{content:"";position:absolute;right:-9px;top:6px;width:6px;height:12px;border-radius:0 3px 3px 0;background:var(--ink)}
.bat i{display:block;height:100%;border-radius:5px;transition:width .7s cubic-bezier(.3,1.4,.5,1),background .7s}
.bat.flash{animation:fl .6s}
@keyframes fl{50%{transform:scale(1.03)}}
.small{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sm{font-size:14px;font-weight:700;color:var(--soft)}
.sm .bar{height:10px;border-radius:6px;background:var(--line);margin-top:4px;overflow:hidden}
.sm .bar i{display:block;height:100%;transition:width .6s}
.sm.warn{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-top:16px}
.card h2{font-size:clamp(24px,5vw,32px);line-height:1.1;margin:0 0 10px;text-wrap:balance;font-weight:900}
.step{font-size:14px;color:var(--soft);font-weight:700;margin-bottom:6px}
.card p{margin:0 0 16px}
.body{font-size:14.5px;color:var(--acc);font-weight:700;margin:-6px 0 14px}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;width:100%;min-height:52px;padding:13px 16px;border-radius:16px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-weight:700;transition:border-color .2s,transform .15s}
.opt{-webkit-tap-highlight-color:transparent}.opt:active{transform:scale(.99)}
@media (hover:hover) and (pointer:fine){.opt:not([disabled]):hover{border-color:var(--soft)}}
.opt:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
.btn:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt[disabled]{opacity:.5;cursor:not-allowed;border-style:dashed}
.opt small{display:block;font-weight:600;color:var(--soft);font-size:13.5px;margin-top:2px}
.btn{font:inherit;font-weight:800;min-height:48px;padding:12px 22px;border-radius:999px;border:0;background:var(--acc);color:var(--accink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.lead{margin:4px 0 18px;padding:16px 18px;border-radius:16px;border-left:6px solid var(--acc);background:light-dark(#fff3ef,#2a1d1b);font-size:21px;line-height:1.35;font-weight:800}
.lead span{display:block;font-size:15.5px;font-weight:600;color:var(--soft);margin-top:6px}
.fb{border-radius:16px;padding:14px 16px;background:light-dark(#fff3ef,#2a1d1b);margin-bottom:16px}
.fb.up{background:light-dark(#fff8dc,#2a2512)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{font-size:14px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.chip.neg{color:#d7381f}.chip.pos{color:light-dark(#8a6a00,#f2c94c)}
.note{font-size:14px;color:var(--soft);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.stat{border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-size:clamp(22px,6vw,30px);font-weight:900;line-height:1.1}
.stat span{font-size:13px;color:var(--soft);font-weight:700}
.fig{position:relative;height:200px;margin:8px 0 18px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
select{font:inherit;font-size:16px;width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.det{margin-top:14px;border-left:4px solid var(--acc);padding:4px 0 4px 14px}
.det h3{margin:0 0 6px;font-size:20px}
.tag{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--acc);color:#fff;margin-bottom:8px}
.cmt label{display:block;font-weight:700;margin:0 0 6px}
.cmt textarea,.cmt input{font:inherit;font-size:16px;width:100%;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:12px}
.cmt textarea{resize:vertical;min-height:120px}
.cmt textarea:focus-visible,.cmt input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.cmt .hp{position:absolute;left:-9999px;width:1px;height:1px}
.cmtSt{font-size:14px;color:var(--soft);margin:10px 0 0!important}
.cmtOk{font-weight:800;margin:0!important}
.sects{margin-top:30px}
.sect{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--card)}
.sect>summary{cursor:pointer;font-weight:900;font-size:20px;padding:15px 44px 15px 18px;list-style:none;position:relative}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary::after{content:"+";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--soft)}
.sect[open]>summary::after{content:"–"}
.sect>summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:16px}
.sectb{padding:0 12px 12px}
.faqh{margin:30px 0 10px;font-size:22px}
.faq{border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.faq summary{cursor:pointer;font-weight:800;padding:13px 40px 13px 16px;list-style:none;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--soft)}
.faq[open] summary::after{content:"–"}
.faq summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:14px}
.faq p{margin:0;padding:0 16px 14px;color:var(--ink)}
.srcb{padding:0 16px 14px}.srcb p{padding:0;margin:0 0 6px;color:var(--soft);font-size:15px}
.srcb h4{margin:14px 0 4px;font-size:15px}
.srcb ol{margin:0;padding-left:18px;font-size:14.5px}.srcb li{margin:6px 0;overflow-wrap:anywhere}.srcb small{display:block;color:var(--soft);font-size:13.5px;line-height:1.4;margin-top:2px}
.srcb a{color:var(--ink)}
.tag.ok{background:light-dark(#2f7d5b,#3c9a70)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:14px}
.intro-links{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.lnk{font:inherit;font-weight:800;background:none;border:0;padding:6px 0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer}
.lnk.inl{display:inline;padding:0;font-weight:700}
.lnk:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px}
.ai{font-size:14px;color:var(--soft);margin:12px 0 0!important}
.foot{font-size:13.5px;color:var(--soft);margin-top:20px}
@media(max-width:600px){.stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sky{height:150px}.clock{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="sky" id="sky">
    <svg id="skysvg" aria-hidden="true"></svg>
    <div class="hd"><h1>Ein Tag mit ADHS</h1><span class="clock" id="clock">06:45</span></div>
  </div>
  <div class="meters" id="meters">
    <div class="erow"><span>Energie</span><b id="ev">75</b></div>
    <div class="bat" id="bat"><i id="ebar"></i></div>
    <div class="small">
      <div class="sm" id="hm">Hunger <span id="hv"></span><div class="bar"><i id="hbar" style="background:#e9963b"></i></div></div>
      <div class="sm" id="tm">Durst <span id="tv"></span><div class="bar"><i id="tbar" style="background:#3b9be9"></i></div></div>
    </div>
  </div>
  <div class="card" id="card"></div>
  <p class="foot">ADHS zeigt sich bei jedem Menschen anders. Dieses Spiel ist eine Annäherung, keine Diagnose – und will vor allem eins: verständlich machen, warum ein „ganz normaler Tag“ so viel Kraft kosten kann.</p>
</div>
<script>
{
const S=[
{t:'06:45',ti:'Der Wecker klingelt',tx:s=>'Gestern ist es spät geworden. Jetzt klingelt der Wecker.',o:s=>[
 {l:'Aufstehen',e:-12,m:1,fb:'Du stehst auf. **Alles fühlt sich zäh an, als würdest du durch Watte laufen.**',x:'Ohne Anlauf in den Tag zu starten verlangt Selbststeuerung – genau die ist bei ADHS morgens oft kaum verfügbar. Das kostet Energie, bevor überhaupt etwas passiert ist.'},
 {l:'Snooze drücken',e:-4,set:['late'],fb:'Noch ein paar Minuten. Und noch ein paar. **Jetzt wird es knapp.**',x:'Schlummern bringt keinen echten Schlaf, nur Aufschub. Dafür startet der Tag mit Zeitdruck, und Zeitdruck ist bei ADHS oft der einzige Motor, der zuverlässig anspringt.'},
 {l:'Kurz aufs Handy schauen',e:3,set:['late','phone'],fb:'Ein paar Nachrichten, ein Video. **Als du hochschaust, ist es deutlich später als gedacht.**',x:'Das Handy liefert schnelle Belohnung und macht das Gehirn wach. Aber Zeitblindheit: Aus „zwei Minuten“ werden 25, und das Handy liegt danach irgendwo.'}]},
{t:'07:20',ti:'In der Küche',tx:s=>s.f.late?'Du bist etwas spät dran. Was machst du in der Küche?':'Zeit fürs Frühstück. Was machst du?',o:s=>[
 {l:'Müsli essen',e:-8,h:-45,t:-15,m:1,fb:'Du isst. **So früh fällt es dir schwer, etwas runterzubekommen.**',x:'Viele Menschen mit ADHS haben morgens kaum Hungergefühl. Sich zum Essen zu zwingen kostet Kraft, zahlt sich aber mittags aus: Hunger frisst sonst Konzentration und Laune.'},
 {l:'Einen Kaffee trinken',e:6,t:-10,fb:'Wärme und Koffein. **Du fühlst dich etwas wacher.**',x:'Koffein hilft kurzfristig, ersetzt aber kein Essen. Der Hunger kommt später zurück – meistens im ungünstigsten Moment.'},
 {l:'Nichts essen und weitermachen',set:['noBreakfast'],fb:'Du sparst Zeit. **Hunger spürst du gerade keinen.**',x:'Interozeption – das Spüren von Körpersignalen wie Hunger und Durst – kann bei ADHS schwächer sein; erste Studien deuten darauf hin. Der Hunger fällt erst auf, wenn er schon an der Energie zieht.'},
 s.f.late&&{l:'Ein Brot für unterwegs mitnehmen',e:-3,h:-25,fb:'**Du isst auf dem Weg zur Tür.**',x:'Ein guter Kompromiss: wenig Planung, schnell, und der Körper bekommt etwas. Solche „gut genug“-Lösungen sparen Energie.'}]},
{t:'07:45',ti:'Der Schlüssel',tx:s=>'Der Schlüssel liegt nicht da, wo du ihn vermutet hast.'+(s.f.phone?' Das Handy findest du gerade auch nicht.':''),o:s=>[
 {l:'Zimmer für Zimmer suchen',e:-10,m:1,fb:'Er steckt in der Jacke von vorgestern. **Dabei ruhig zu bleiben hat viel Konzentration gekostet.**',x:'„Einfach systematisch suchen“ braucht Arbeitsgedächtnis und Ruhe, während innerlich schon der Alarm schrillt. Ruhig wirken und gleichzeitig suchen ist doppelte Arbeit.'},
 {l:'Überall gleichzeitig nachsehen',e:-14,set:['late','chaos'],fb:'Gefunden. **Dabei ist einiges durcheinandergeraten.**',x:'Stress verengt den Blick, man sucht dreimal an derselben Stelle. Und das Chaos wartet am Abend.'},
 {l:'Den Ersatzschlüssel nehmen',e:-3,set:['noPhones'],fb:'Schnell gelöst. **Dass die Kopfhörer noch auf dem Tisch liegen, merkst du erst später.**',x:'Feste Strategien wie ein Ersatzschlüssel sind Gold wert. Aber beim Umplanen fällt etwas anderes durch – das Arbeitsgedächtnis hat nur begrenzt Plätze.'}]},
{t:'08:15',ti:'In der Bahn',tx:s=>'Die Bahn ist voll. Neben dir telefoniert jemand, weiter hinten weint ein Kind.'+(s.f.noPhones?' Deine Kopfhörer hast du nicht dabei.':''),o:s=>[
 !s.f.noPhones&&{l:'Kopfhörer aufsetzen',e:-2,fb:'**Um dich herum wird es leiser.**',x:'Viele Menschen mit ADHS berichten, dass sie Reize schlechter filtern können: Alles kommt gleichzeitig und gleich laut an. Kopfhörer sind kein Luxus, sondern ein Filter von außen.'},
 {l:'Einfach mitfahren',e:-12,m:1,fb:'Von außen sieht man dir nichts an. **Innen kommt jedes Geräusch einzeln und laut an.**',x:'Reize nicht ausblenden zu können und dabei so zu tun, als wäre alles normal, ist Masking. Es kostet doppelt: einmal die Reize, einmal das Verstecken.'},
 {l:'Eine Station früher aussteigen und laufen',e:-4,t:6,set:s.f.late?['lateWork']:[],fb:'Frische Luft, der Kopf wird klarer. **Dafür brauchst du länger.**',x:'Bewegung hilft dem ADHS-Gehirn, sich zu regulieren. Sie kostet aber Zeit – wer eh schon spät dran war, kommt jetzt zu spät.'},
 {l:'Aufs Handy schauen',e:-5,fb:'Etwas Ablenkung. **Die Geräusche bleiben trotzdem.**',x:'Ablenkung dämpft, löst aber das Problem nicht: Das Gehirn verarbeitet weiter alles, nur mit einem Kanal mehr.'}]},
{t:'08:55',ti:'Im Büro',tx:s=>(s.f.lateWork?'Du kommst zwanzig Minuten zu spät. ':s.f.late&&!s.f.noPhones?'Du kommst zehn Minuten zu spät. ':'')+'Eine Kollegin erzählt dir von ihrem Wochenende am See.',o:s=>[
 {l:'Zuhören und nachfragen',e:-12,m:1,fb:'Sie freut sich über dein Interesse. **Bei ihr zu bleiben ist anstrengender, als es aussieht.**',x:'Aufmerksamkeit halten, Mimik steuern, abschweifende Gedanken zurückholen – für neurotypische Menschen beiläufig, für ADHS aktive Arbeit.'},
 {l:'Von deinem eigenen Ausflug an den See erzählen',e:4,set:['interrupted'],fb:'Dir fällt eins nach dem anderen ein, es macht Spaß. Sie wirkt kurz überrascht – **du bist ihr ins Wort gefallen.**',x:'Spontane Begeisterung gibt Energie. Aber Impulsivität im Gespräch kann andere irritieren – und später läuft im Kopf die Schleife: „War ich wieder zu viel?“'},
 {l:'Sagen, dass du erst ankommen möchtest',e:-4,fb:'Sie nickt. **Du ziehst in Ruhe die Jacke aus.**',x:'Grenzen setzen statt Masking: kostet etwas Mut, spart aber viel Energie. Und offene Kommunikation schafft Verständnis.'}]},
{t:'09:30',ti:'Die Reisekostenabrechnung',tx:s=>'Die Abrechnung muss heute raus: ein Formular, drei Belege.',o:s=>[
 {l:'Am Stück erledigen',e:-18,m:1,fb:'Fertig. **Es hat sich viel länger angefühlt, als es war.**',x:'Langweilige Aufgaben ohne Belohnung sind für das ADHS-Gehirn wie Bergauffahren mit angezogener Handbremse. Das ist keine Faulheit: Studien finden bei ADHS Unterschiede im Belohnungssystem des Gehirns, in dem Dopamin eine zentrale Rolle spielt.'},
 {l:'In kurzen Etappen mit Musik arbeiten',e:-8,t:-20,fb:'**Drei Runden, zwischendurch ein Glas Wasser.** Erledigt.',x:'Kleine Etappen und kleine Belohnungen machen Langeweile erträglich. Und das Wasserholen ist nebenbei Selbstfürsorge.'},
 {l:'Zuerst die Mails durchsehen',e:-3,set:['procrastinated'],fb:'Die Mails sind durch. **Die Abrechnung liegt noch da.**',x:'Aufschieben ist bei ADHS selten Bequemlichkeit, sondern eine Blockade beim Starten. Die Aufgabe verschwindet aber nicht – sie wird schwerer, je länger sie wartet.'}]},
{t:'10:30',ti:'Das neue Projekt',tx:s=>'Eine Mail zum neuen Projekt kommt rein. Das Thema interessiert dich sehr.',o:s=>[
 {l:'Direkt loslegen',e:16,h:22,t:24,set:['hyperfocus'],fb:'Die Zeit vergeht wie im Flug. **Es läuft richtig gut.**',x:'Hyperfokus ist die Kehrseite: Wenn etwas wirklich interessiert, fließt die Energie. Dabei verschwinden Essen, Trinken, Toilette und Zeit komplett aus dem Bewusstsein.'},
 {l:'Ideen notieren und später weitermachen',e:-10,m:1,fb:'Die Notiz ist gespeichert. **Du gehst zurück zu deinen anderen Aufgaben.**',x:'Begeisterung zu unterdrücken kostet Kraft. Das ist vernünftig – aber man verzichtet auf die einzige Energiequelle des Vormittags.'},
 {l:'Loslegen und einen Wecker stellen',e:10,t:-8,set:['timer'],fb:'Nach einer Stunde klingelt der Wecker. **Du holst dir etwas zu trinken.**',x:'Hyperfokus mit Leitplanke: Man nutzt den Energieschub und schützt sich vor dem Absturz danach.'},
 {l:'Erstmal etwas trinken',e:-2,t:-25,set:['drankFirst'],fb:'Du holst dir in der Küche ein großes Glas Wasser. **Zurück am Schreibtisch wartet die Mail.**',x:'Vor dem Eintauchen kurz für den Körper sorgen ist eine gute Strategie – wenn man danach wirklich anfängt. Jede Unterbrechung ist bei ADHS aber auch eine Weiche: zurück zum Interessanten oder hinein in etwas ganz anderes.'}]},
{t:'10:45',ti:'Zurück am Schreibtisch',if:s=>s.f.drankFirst,tx:s=>'Das Wasserglas steht neben der Tastatur. Die Mail zum neuen Projekt ist noch offen – daneben leuchtet das Postfach: 7 ungelesene Nachrichten.',o:s=>[
 {l:'Jetzt mit dem Projekt loslegen',e:14,h:20,t:12,set:['hyperfocus'],fb:'Mit dem Wasser neben dir tauchst du ab. Die Zeit vergeht wie im Flug, **es läuft richtig gut.**',x:'Erst den Körper versorgen, dann eintauchen: Der Hyperfokus kommt trotzdem – aber diesmal mit vollem Glas. Der Durst holt dich später ein, der Hunger genauso wie sonst.'},

{t:'12:30',ti:'Mittagspause',tx:s=>s.f.hyperfocus?'Als du das nächste Mal auf die Uhr schaust, ist es 13:50. Dir ist ein bisschen schwindelig.':'Die Kolleg*innen gehen gemeinsam in die Kantine.',o:s=>[
 {l:'Mit in die Kantine gehen',e:-12,h:-50,t:-20,m:1,fb:'Du isst mit den anderen. **Es ist laut, und du unterhältst dich viel.**',x:'Essen ist gut. Aber Lärm, Gruppengespräche und spontane Entscheidungen machen die Pause zur nächsten Anstrengung statt zur Erholung.'},
 {l:'Allein spazieren gehen und ein Brötchen essen',e:6,h:-45,t:-15,fb:'Ruhe und frische Luft. **Danach fühlst du dich besser.**',x:'Ruhe und Bewegung laden auf. Rückzug ist kein Desinteresse an den anderen, sondern Energiemanagement.'},
 {l:'Am Schreibtisch weiterarbeiten',e:-4,set:['skippedLunch'],fb:'Du arbeitest weiter. **Essen kannst du ja später noch.**',x:'Pausen ausfallen lassen fühlt sich effizient an. Ohne Essen sinkt die Energie aber den ganzen Nachmittag weiter.'},
 s.f.hyperfocus&&{l:'Einen Riegel aus der Schublade essen',e:-1,h:-20,t:-10,fb:'**Schnell gegessen.**',x:'Nach dem Hyperfokus ist ein schneller Snack oft das Realistischste. Er hält aber nicht lange vor.'}]},
{t:'14:00',ti:'Teammeeting',tx:s=>'90 Minuten, Kamera an. Thema: Quartalsplanung.',o:s=>[

function sky(t){

  let st='';if(night)for(let k=0;k<26;k++)st+='<circle cx="'+((k*97)%W)+'" cy="'+((k*53)%(H*.7))+'" r="'+(k%3?1:1.6)+'" fill="#fff" opacity=".8"/>';
  const body=night?'<circle cx="'+(W*.8)+'" cy="'+(H*.42)+'" r="20" fill="#f4f1de"/><circle cx="'+(W*.8+9)+'" cy="'+(H*.42-6)+'" r="17" fill="'+c[0]+'"/>':'<circle cx="'+x+'" cy="'+y+'" r="34" fill="#fff6c9" opacity=".35"/><circle cx="'+x+'" cy="'+y+'" r="22" fill="#ffe27a"/>';
  const hill='<path d="M0 '+(H*.86)+' Q'+(W*.25)+' '+(H*.7)+' '+(W*.5)+' '+(H*.84)+' T'+W+' '+(H*.78)+' V'+H+' H0Z" fill="rgba(0,0,0,.14)"/>';
  sv.innerHTML=st+body+hill;
}

function render(){

    $('go').onclick=()=>{phase='q';render();};

function choose(k){
  const sc=S[i],o=cur[k];if(o.need&&s.e<o.need)return;
  const b={e:s.e,h:s.h,t:s.t},notes=[],ctx=sc.tx(s);

  (o.set||[]).forEach(f=>s.f[f]=1);

  s.log.push({t:sc.t,ti:sc.ti,ctx,l:o.l,x:o.x,m:o.m,d,notes,after:Math.round(s.e),others:cur.filter(x=>x!==o).map(x=>x.l)});

function verdict(){

  if(f.hobby)return['Abends hattest du noch eine Stunde für dich.','Für Freund*innen hat es nicht gereicht, aber die Gitarre hat dich aufgefangen.'];
  if(s.hist[s.hist.length-3]<35)return['Am Abend war der Akku leer.','Freund*innen treffen? Ein Hobby? Dafür war schlicht keine Energie mehr da. Nicht, weil du nicht wolltest – sondern weil der Tag alles verbraucht hat.'];
  return['Der Abend gehörte der Ruhe.','Du hättest noch etwas Energie gehabt, hast dich aber für Erholung entschieden. Auch das ist eine Entscheidung, die man sich mit ADHS oft bewusst erlauben muss.'];
}
const SRC='<details class="sect src"><summary>Quellen & Hintergrund</summary><div class="srcb"><p>Das Spiel vereinfacht bewusst. Diese Quellen stützen die Erklärungen; zu jeder Quelle steht, wie belastbar sie ist. Begriffe wie „ADHS-Paralyse“, „Body Doubling“ oder „Revenge Bedtime Procrastination“ stammen vor allem aus Erfahrungsberichten und sind wissenschaftlich noch wenig untersucht. Stand der Prüfung: November 2026.</p><h4>Leitlinie &amp; Diagnose</h4><ol start="1"><li><a href="https://register.awmf.org/de/leitlinien/detail/028-045" target="_blank" rel="noopener">AWMF: S3-Leitlinie ADHS bei Kindern, Jugendlichen und Erwachsenen (Reg.-Nr. 028-045)</a><small>Maßgebliche deutsche Leitlinie. Die Fassung von 2018 ist formal abgelaufen; eine überarbeitete Fassung lag 2026 zur Konsultation vor.</small></li><li><a href="https://www.gesundheit.gv.at/krankheiten/psyche/adhs/erwachsene.html" target="_blank" rel="noopener">Gesundheitsportal Österreich (gesundheit.gv.at): ADHS bei Erwachsenen</a><small>Öffentliches Gesundheitsportal; allgemeinverständlich.</small></li></ol><h4>Körpersignale (Interozeption)</h4><ol start="3"><li><a href="https://pubmed.ncbi.nlm.nih.gov/39905593/" target="_blank" rel="noopener">Colgan et al. (2025): Diminished Interoceptive Accuracy in ADHD: A Systematic Review. Psychophysiology</a><small>Aktueller Überblick: stärkere ADHS-Merkmale gehen eher mit schwächerer Körperwahrnehmung einher. Wenige Studien.</small></li><li><a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6185835/" target="_blank" rel="noopener">Wiersema &amp; Godefroid (2018): Interoceptive awareness in attention deficit hyperactivity disorder. PLOS ONE</a><small>Gegenbefund: Diese kleine Studie (24 vs. 23 Erwachsene) fand keinen Unterschied – deshalb formuliert das Spiel vorsichtig.</small></li></ol><h4>Belohnungssystem &amp; Motivation</h4><ol start="5"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2958516/" target="_blank" rel="noopener">Volkow et al. (2009): Evaluating dopamine reward pathway in ADHD. JAMA 302(10)</a><small>Viel zitierte PET-Studie (53 vs. 44 Erwachsene). Die Deutung als Motivationsdefizit ist eine Interpretation, kein Beweis.</small></li></ol><h4>Hyperfokus</h4><ol start="6"><li><a href="https://pubmed.ncbi.nlm.nih.gov/30267329/" target="_blank" rel="noopener">Hupfeld et al. (2019): Living „in the zone“: hyperfocus in adult ADHD</a><small>Selbstauskunft per Fragebogen. Ob Hyperfokus spezifisch für ADHS ist, ist umstritten.</small></li></ol><h4>Zeitwahrnehmung</h4><ol start="7"><li><a href="https://eprints.soton.ac.uk/456003" target="_blank" rel="noopener">Marx et al. (2021): Meta-analysis: Altered Perceptual Timing Abilities in ADHD</a><small>Meta-Analyse über 55 Studien (Kinder und Erwachsene).</small></li><li><a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9962130/" target="_blank" rel="noopener">Mette (2023): Time Perception in Adult ADHD: Findings from a Decade – A Review</a><small>Erzählender Überblick über nur 9 Studien; die Zeitschrift (IJERPH, MDPI) wurde 2023 aus dem Web of Science entfernt.</small></li></ol><h4>Reizfilterung</h4><ol start="9"><li><a href="https://doi.org/10.3389/fnhum.2021.771711" target="_blank" rel="noopener">Blomberg et al. (2021): The Effects of Working Memory Load on Auditory Distraction in Adults With ADHD. Frontiers in Human Neuroscience</a><small>Kleine fMRT-Studie (17 vs. 17 Personen).</small></li></ol><h4>Masking</h4><ol start="10"><li><a href="https://www.sfu.ca/sfunews/stories/2026/06/adults-with-adhd-may-pay-high-price-to-mask-traits-and-fit-in--s/" target="_blank" rel="noopener">Simon Fraser University (2026): Adults with ADHD may pay high price to mask traits and fit in</a><small>Pressemitteilung zu einer Studie von Mylett &amp; Iarocci in „Research in Neurodiversity“. Nicht repräsentative Befragung (202 Personen).</small></li></ol><h4>Emotionen &amp; Kritik</h4><ol start="11"><li><a href="https://pubmed.ncbi.nlm.nih.gov/24480998/" target="_blank" rel="noopener">Shaw et al. (2014): Emotion dysregulation in attention deficit hyperactivity disorder. American Journal of Psychiatry</a><small>Viel zitierter Überblick.</small></li><li><a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7069054/" target="_blank" rel="noopener">Beheshti, Chavanon &amp; Christiansen (2020): Emotion dysregulation in adults with ADHD: a meta-analysis. BMC Psychiatry</a></li></ol><h4>Bewegung</h4><ol start="13"><li><a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11907377/" target="_blank" rel="noopener">Yang et al. (2025): The impact of physical activity on inhibitory control of adult ADHD: a systematic review and meta-analysis. Journal of Global Health</a><small>Positive Effekte, aber wenige und sehr unterschiedliche Studien.</small></li></ol><h4>Body Doubling</h4><ol start="14"><li><a href="https://www.understood.org/articles/body-doubling-for-adhd-what-it-is-and-how-it-works" target="_blank" rel="noopener">Understood: Body doubling for ADHD – what it is and how it works</a><small>Ratgeberseite einer gemeinnützigen Organisation, keine Studie. Wissenschaftlich ist Body Doubling kaum untersucht.</small></li></ol><h4>Schlaf, Koffein &amp; Alkohol</h4><ol start="15"><li><a href="https://pubmed.ncbi.nlm.nih.gov/39354860/" target="_blank" rel="noopener">van der Ham et al. (2024): Sleep Problems in Adults With ADHD: Prevalences and Their Relationship With Psychiatric Comorbidity. Journal of Attention Disorders</a><small>3.691 Patient*innen einer Spezialambulanz; Werte gelten nicht für alle Menschen mit ADHS.</small></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/24994989/" target="_blank" rel="noopener">Kroese et al. (2014): Bedtime procrastination: introducing a new area of procrastination. Frontiers in Psychology</a><small>Führte den Begriff ein. Ob es sich um Aufschieben oder um den Biorhythmus handelt, ist umstritten (Kühnel et al. 2018). „Revenge“ ist ein Begriff aus den sozialen Medien.</small></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3805807/" target="_blank" rel="noopener">Drake et al. (2013): Caffeine effects on sleep taken 0, 3, or 6 hours before going to bed. Journal of Clinical Sleep Medicine</a><small>Kleine Studie (12 Personen), hohe Dosis; Ergebnis seither mehrfach bestätigt.</small></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/23347102/" target="_blank" rel="noopener">Ebrahim et al. (2013): Alcohol and sleep I: effects on normal sleep. Alcoholism: Clinical &amp; Experimental Research</a><small>Überblick über 20 Laborstudien.</small></li><li><a href="https://research.monash.edu/en/publications/the-effect-of-alcohol-on-subsequent-sleep-in-healthy-adults-a-sys/" target="_blank" rel="noopener">Gardiner et al. (2025): The effect of alcohol on subsequent sleep in healthy adults: a systematic review and meta-analysis. Sleep Medicine Reviews</a><small>Aktuelle Meta-Analyse: deutlich weniger und späterer REM-Schlaf; andere Effekte uneinheitlich.</small></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/28647007/" target="_blank" rel="noopener">Groenman, Janssen &amp; Oosterlaan (2017): Childhood Psychiatric Disorders as Risk Factor for Subsequent Substance Abuse: A Meta-Analysis. JAACAP</a><small>37 Studien; ADHS in der Kindheit etwa doppeltes Risiko für spätere Alkoholprobleme.</small></li></ol></div></details>';
const FAQ='<details class="faq"><summary>Warum wird im Spiel so wenig getrunken?</summary><p>Der Durst steigt in jeder Situation von allein – trinken musst du dagegen bewusst auswählen, und das passiert selten. Genau so erleben es viele Menschen mit ADHS: Körpersignale wie Durst und Hunger werden schwächer wahrgenommen (Interozeption – die Studienlage ist noch dünn und nicht einheitlich; ein aktueller Überblick von 2025 findet aber eher eine schwächere Wahrnehmung) oder im nächsten Moment wieder von etwas Interessanterem überschrieben. Und selbst wenn Durst und Hunger auffallen, landen sie auf der inneren Prioritätenliste oft weit unten: Vieles andere – wie das neue Projekt, die Mail oder die nächste Aufgabe – erscheint im Moment wichtiger, und „gleich trinke ich was“ wird schnell vergessen. Trinken ist außerdem eine kleine, unbelohnte Aufgabe ohne festen Zeitpunkt – genau die Art Aufgabe, die bei ADHS am leichtesten durchrutscht. Die Folgen merkt man erst später: Kopfschmerzen, Konzentrationsprobleme, Gereiztheit.</p></details><details class="faq"><summary>Warum ist die Energie am Ende des Tages fast immer zu niedrig?</summary><p>Das ist Absicht. Kaum eine einzelne Entscheidung ist dramatisch, aber fast jede kostet ein bisschen: Wecker, Schlüssel, Lärm in der Bahn, Smalltalk, Formulare, Meetings, Einkaufen, Haushalt. Dazu kommen Hunger und Durst, die unbemerkt Energie abziehen. Bei ADHS braucht vieles davon bewusste Steuerung, die andere automatisch nebenbei erledigen. Am Abend ist der Akku dann leer – nicht wegen eines großen Ereignisses, sondern wegen vieler kleiner. Wer im Spiel öfter auf ADHS-freundliche Strategien setzt, hat abends mehr übrig. Wirklich ausgeruht ist man trotzdem selten. Der Akku ist dabei ein Bild, kein Messwert: Er steht für das, was Betroffene oft als begrenzte Kraft für den Tag beschreiben.</p></details><details class="faq"><summary>Warum startet die Energie schon morgens bei 75 und nicht bei 100?</summary><p>Weil viele Menschen mit ADHS nicht ausgeruht in den Tag starten. Schlafprobleme sind bei ADHS häufig: In einer großen Untersuchung von Patient*innen einer Spezialambulanz zeigten rund 60 % Hinweise auf eine Schlafstörung. Am häufigsten war ein nach hinten verschobener Schlafrhythmus – man wird abends erst spät müde, muss morgens aber trotzdem früh aufstehen. Dazu kommen Einschlafprobleme, weil das Gedankenkarussell gerade dann laut wird, wenn es still ist, und das Aufbleiben, weil sich der späte Abend wie die einzige freie Zeit anfühlt. Das Ergebnis: Der Schlaf ist zu kurz oder wenig erholsam, und der Akku ist morgens nicht voll. Deshalb beginnt das Spiel bei 75 – und mit dem Satz „Gestern ist es spät geworden.“</p></details><details class="faq"><summary>Kann man das Spiel gewinnen?</summary><p>Nein. Es gibt keine richtigen oder falschen Antworten. Manche Entscheidungen sparen Energie, kosten aber an anderer Stelle – Zeit, Ansehen, Gesundheit oder den nächsten Tag. Darum geht es: zu zeigen, dass Menschen mit ADHS ständig solche Abwägungen treffen, oft ohne dass es jemand sieht.</p></details><details class="faq"><summary>Warum kosten gerade die „vernünftigen“ Antworten so viel?</summary><p>Weil sie oft Masking bedeuten: sich so zu verhalten, wie es von außen erwartet wird – still sitzen, aufmerksam wirken, alles am Stück erledigen. Für Menschen ohne ADHS geht das meist nebenbei. Mit ADHS ist es aktive Arbeit, die viel Konzentration und Kraft verbraucht. Von außen sieht man davon nichts – nur, dass jemand abends absagt. In einer nicht repräsentativen Befragung von 2026 gaben über 90 % der teilnehmenden Erwachsenen mit ADHS an, ihre Symptome im Alltag zu verbergen oder auszugleichen – und beschrieben das als sehr kraftraubend.</p></details><details class="faq"><summary>Das kenne ich doch auch – jeder vergisst mal den Schlüssel?</summary><p>Stimmt, und das ist ein wichtiger Punkt: Die Situationen im Spiel sind ganz alltäglich. Der Unterschied bei ADHS liegt darin, wie oft sie passieren, wie stark sie sind und wie viel Kraft es kostet, sie auszugleichen. Einmal den Schlüssel suchen ist ärgerlich. Wenn so etwas täglich und in vielen Bereichen gleichzeitig passiert, wird es zur Dauerbelastung.</p></details><details class="faq"><summary>Was ist Hyperfokus – und warum gibt er im Spiel Energie?</summary><p>Hyperfokus ist ein Zustand sehr tiefer Konzentration auf etwas, das wirklich interessiert. Dann fließt die Energie, und die Arbeit gelingt oft besonders gut. Die Kehrseite: Zeit, Essen, Trinken und Pausen verschwinden komplett aus dem Bewusstsein. Deshalb gibt der Hyperfokus im Spiel Energie, lässt aber Hunger und Durst stark steigen. Hyperfokus lässt sich übrigens nicht einfach einschalten – er hängt am Interesse, nicht am Willen. Er ist kein offizielles Diagnosekriterium, wird aber von Erwachsenen mit ADHS in Studien häufiger berichtet. Ob er wirklich typisch für ADHS ist, wird in der Forschung noch diskutiert.</p></details><details class="faq"><summary>Wenn jemand Zeit für ein Hobby hat, kann es doch nicht so schlimm sein?</summary><p>Hobbys und Interessen laden auf – aber man braucht Energie, um überhaupt anzufangen. Ist der Akku leer, bleibt selbst das Schöne liegen. Und wer mit ADHS etwas gern macht, kann sich oft gut darauf konzentrieren. Das widerspricht ADHS nicht: Es geht nicht um zu wenig Aufmerksamkeit, sondern darum, sie nicht zuverlässig steuern zu können.</p></details><details class="faq"><summary>Warum gibt es Optionen wie Wein oder Cola?</summary><p>Weil sie zum Alltag vieler Menschen mit ADHS gehören. Zucker, Koffein und Alkohol werden häufig genutzt, um sich zu regulieren – wacher zu werden oder das Gedankenkarussell leiser zu stellen. Kurzfristig hilft das, langfristig kostet es: schlechterer Schlaf, weniger Energie am nächsten Tag und bei Alkohol ein erhöhtes Risiko für eine Abhängigkeit: Kinder mit ADHS haben später ein etwa doppelt so hohes Risiko für alkoholbezogene Störungen.</p></details><details class="faq"><summary>Ich habe mich in vielem wiedererkannt. Habe ich ADHS?</summary><p>Das kann dieses Spiel nicht beantworten. Es ist ein Einblick, kein Test und keine Diagnose – weder für dich noch für andere. Viele Situationen kennen alle Menschen. Wenn du dich im Alltag dauerhaft stark eingeschränkt fühlst, sprich mit deiner Hausärztin oder deinem Hausarzt. Sie können eine erste Einschätzung geben und überweisen. Die Diagnose stellen Fachärzt*innen für Psychiatrie und Psychotherapie oder Psychotherapeut*innen mit ADHS-Erfahrung nach einer ausführlichen Untersuchung.</p></details><details class="faq"><summary>Wie kann ich Menschen mit ADHS unterstützen?</summary><p>Frag, was hilft, statt zu raten – jede Person ist anders. Wichtige Infos lieber zusätzlich schriftlich geben. Pausen, Bewegung und Kopfhörer nicht als Desinteresse deuten. Gemeinsam an etwas arbeiten („Body Doubling“) kann manchen das Anfangen leichter machen. Und wenn jemand abends absagt: nicht persönlich nehmen. Oft war schlicht keine Energie mehr übrig.</p></details>';

      const res=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},

}
